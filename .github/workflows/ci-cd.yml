# CI/CD de la boutique
#
# CI (à chaque push sur main et à chaque pull request) :
#   1. tests du back       2. tests + build du front       3. build des images Docker
#
# CD (quand on pousse un tag v1.4.0, v2.0.0…) :
#   4. publication des images sur ghcr.io (onglet « Packages » du dépôt)
#   5. création automatique de la release GitHub
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Si on pousse deux fois de suite, l'ancienne exécution est annulée
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Droits minimum par défaut ; chaque job demande seulement ce dont il a besoin
permissions:
  contents: read

jobs:
  back:
    name: Back – tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npm test

  front:
    name: Front – tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build

  docker:
    name: Image Docker – ${{ matrix.service }}
    needs: [back, front] # seulement si tous les tests sont passés
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pour publier sur ghcr.io
    strategy:
      matrix:
        service: [back, front] # le même job, lancé une fois par dossier
    env:
      PUBLIER: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      # ghcr.io exige un nom en minuscules (Tangzer5635 → tangzer5635)
      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/boutique-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Connexion à ghcr.io
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag v1.4.0 → images 1.4.0, 1.4 et latest
      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.PUBLIER }}
            type=sha

      - name: Build (et publication si c'est un tag)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: ${{ env.PUBLIER == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    name: Release GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write # pour créer la release
    steps:
      - uses: actions/checkout@v7
      # Titre de la release = message du tag (git tag -a v1.4.0 -m "v1.4.0 – CI/CD")
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          TITRE=$(git tag -l --format='%(contents:subject)' "$TAG")
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "La release $TAG existe déjà : rien à faire"
          else
            gh release create "$TAG" --title "${TITRE:-$TAG}" --generate-notes
          fi

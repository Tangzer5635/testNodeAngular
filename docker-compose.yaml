services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      # Lu dans le fichier .env à la racine du projet (voir .env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans le fichier .env à la racine du projet}
      POSTGRES_DB: boutique
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définis POSTGRES_PASSWORD dans le fichier .env à la racine du projet}
      POSTGRES_DB: boutique
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boutique"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build: ./back
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: boutique
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Définis JWT_SECRET dans le fichier .env à la racine du projet}
      JWT_EXPIRES_IN: 2h
      CORS_ORIGIN: http://localhost:8080
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  front:
    build: ./front
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - back

volumes:
  db_data:
  uploads:

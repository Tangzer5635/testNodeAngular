<div class="entete">
  <h1>Administration</h1>
  <a routerLink="/admin/nouveau" class="bouton">+ Ajouter un vêtement</a>
</div>

@if (erreur()) {
  <p class="erreur">{{ erreur() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Nom</th>
      <th>Catégorie</th>
      <th>Prix</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (vetement of vetements(); track vetement.id) {
      <tr>
        <td>{{ vetement.nom }}</td>
        <td>{{ vetement.categorie }}</td>
        <td>{{ vetement.prix | currency:'EUR' }}</td>
        <td class="actions">
          <a routerLink="/admin/{{ vetement.id }}">Modifier</a>
          <button type="button" (click)="supprimer(vetement)">Supprimer</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">Aucun vêtement.</td>
      </tr>
    }
  </tbody>
</table>

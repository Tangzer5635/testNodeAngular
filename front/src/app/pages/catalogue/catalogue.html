<h1>Catalogue</h1>
<ul>@for (vetement of vetements(); track vetement.id) {
    <li>
        <h2><a routerLink="/vetements/{{ vetement.id }}">{{ vetement.nom }}</a></h2>
        <p>{{ vetement.categorie }}</p>
        <p>{{ vetement.prix | currency:'EUR' }}</p>
    </li>
}
@empty {
  <li>Aucun article disponible</li>
}
</ul>

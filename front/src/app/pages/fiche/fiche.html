@if (erreur()) {
  <p>{{ erreur() }}</p>
} @else if (vetement(); as v) {
  @if (v.image) {
    <img [src]="imagesUrl + '/' + v.image" [alt]="v.nom" />
  }
  <h1>{{ v.nom }}</h1>
  <p>{{ v.description }}</p>
  <p>Catégorie : {{ v.categorie }}</p>
  <p>Prix : {{ v.prix | currency:'EUR' }}</p>
  <p>Tailles disponibles : {{ v.tailles.join(', ') }}</p>
} @else {
  <p>Chargement…</p>
}
<a routerLink="/">Retour au catalogue</a>

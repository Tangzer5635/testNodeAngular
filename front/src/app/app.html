<header>
  <a routerLink="/" class="logo">{{ nomBoutique }}</a>
  <nav>
    <a routerLink="/" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }">Catalogue</a>
    <a routerLink="/panier" routerLinkActive="actif">
      Panier
      @if (panier.nombreArticles() > 0) {
        <span class="badge">{{ panier.nombreArticles() }}</span>
      }
    </a>
    @if (auth.estConnecte()) {
      <a routerLink="/admin" routerLinkActive="actif">Administration</a>
      <button type="button" (click)="seDeconnecter()">Déconnexion</button>
    } @else {
      <a routerLink="/connexion" routerLinkActive="actif">Connexion</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer>
  <p>&copy; {{ annee }} - {{ nomBoutique }}</p>
</footer>

server {
  listen 80;
  server_name _;
  server_tokens off; # ne pas afficher la version de nginx dans les réponses

  root /usr/share/nginx/html;
  index index.html;

  # Appels à l'API : transmis au conteneur « back » (même origine pour le navigateur, donc pas de CORS)
  location /api/ {
    proxy_pass http://back:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Images des vêtements : servies par le back
  location /images/ {
    proxy_pass http://back:3000;
  }

  # Routes Angular (/admin, /vetements/3…) : nginx ne les connaît pas, on renvoie index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Taille maximale d'une requête (envoi d'images : 2 Mo + marge)
  client_max_body_size 3m;
}
